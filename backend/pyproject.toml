[project]
name = "proforce-backend"
version = "0.1.0"
description = "Proforce Airsystems in-house tooling — unified backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.17",
    "redis>=5.2",
    "httpx>=0.28",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (Depends(...) in a default arg) is the standard, intended FastAPI
# dependency-injection pattern — not a real bug, so it's excluded globally
# rather than noqa'd on every route.
ignore = ["B008"]

[tool.ruff.lint.isort]
# Without this, ruff's import sorter can misclassify local first-party
# modules (and even the `alembic` package, since `alembic/` is also a
# subdirectory of this project) — being explicit avoids that ambiguity.
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Hand-written schema migrations mirror SQLAlchemy column definitions
# 1:1 with the models they came from — wrapping every long `sa.Column(...)`
# call to fit 100 chars hurts readability more than it helps, and import
# order in a migration file has no functional meaning.
"alembic/env.py" = ["I001"]
"alembic/versions/*.py" = ["E501", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
