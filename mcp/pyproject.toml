[project]
name = "pfair-mcp"
version = "0.1.0"
description = "MCP server exposing PF-AIR In-house Tooling data to AI clients (Phase 1: local, read-only)"
requires-python = ">=3.11"
dependencies = [
    # Pinned to the 2.x line this was built against — the 1.x -> 2.x
    # release renamed FastMCP to MCPServer and changed enough of the
    # surface API that code written for one won't run on the other.
    "mcp>=2.0,<3",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.scripts]
pfair-mcp = "pfair_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Mocks the httpx transport directly (vs. spinning up a real server),
    # matching this project's own "mock the HTTP boundary" testing style
    # rather than needing a live backend — see tests/conftest.py.
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["pfair_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pfair_mcp"]
